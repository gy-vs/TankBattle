[pytest]
# pytest 配置

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = -v --tb=short --color=yes

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 耗时较长的测试
